# Smithery.ai configuration https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      octadezxApiKey:
        type: string
        default: ""
        description: "Optional OctaDezx API key. Leave blank to run the 4 offline deterministic tools (audit_knowledge_base, verify_reply_safety, plan_multistep_inquiry, calculate_support_tco) locally with zero credentials."
      endpoint:
        type: string
        default: "https://octadezx.com/mcp"
        description: "OctaDezx hosted MCP endpoint for optional cloud workspace tools"
  commandFunction:
    |-
    (config) => ({
      "command": "node",
      "args": [
        "server.js"
      ],
      "env": {
        ...(config?.octadezxApiKey ? { "OCTADEZX_API_KEY": config.octadezxApiKey } : {}),
        "OCTADEZX_ENDPOINT": config?.endpoint || "https://octadezx.com/mcp"
      }
    })
